<html lang="en">

<meta name="mobile-web-app-capable" content="yes" />

<style>
  :root {
    --paper: #FBF7F0;
    --ink: #1F1B16;
    --ink-soft: #5B5347;
    --green: #2F5233;
    --green-soft: #E7EDE4;
    --brick: #B4552F;
    --line: #DDD5C7;
    --card: #FFFFFF;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }

  h1, h2, h3 { font-family: Georgia, "Times New Roman", serif; margin: 0; }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }

  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 14px;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 14px;
    gap: 12px;
    flex-wrap: wrap;
  }

  header.top h1 {
    font-size: 26px;
    letter-spacing: 0.2px;
  }

  .top-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  header.top .tag {
    font-size: 13px;
    color: var(--ink-soft);
  }

  .install-btn {
    background: var(--green);
    color: var(--paper);
    border: none;
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .install-btn:hover { background: #24401F; }
  .install-btn:focus-visible { outline: 2px solid var(--brick); outline-offset: 2px; }

  .ios-hint {
    background: var(--green-soft);
    color: var(--green);
    border: 1px solid var(--green);
    border-radius: 8px;
    padding: 9px 13px;
    font-size: 13px;
    margin-bottom: 14px;
  }

  /* Location bar */
  .location-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 13px;
    color: var(--ink-soft);
    padding: 9px 13px;
    border: 1px solid var(--line);
    border-radius: 8px;
    margin-bottom: 14px;
    background: var(--card);
  }
  .location-bar.granted { border-color: var(--green); color: var(--green); background: var(--green-soft); }
  .location-bar.denied { border-color: var(--brick); color: var(--brick); background: #FBEDE6; }
  .location-bar .loc-text { display: flex; align-items: center; gap: 7px; }
  .location-bar button.retry {
    border: 1px solid currentColor;
    background: none;
    color: inherit;
    font-size: 12.5px;
    padding: 4px 10px;
    border-radius: 999px;
    cursor: pointer;
  }
  .location-bar button.retry:hover { opacity: 0.75; }

  /* Search */
  .search-block {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 20px;
  }

  .search-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }

  input[type="text"] {
    flex: 1;
    padding: 11px 13px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 15px;
    background: var(--paper);
    color: var(--ink);
  }
  input[type="text"]:focus {
    outline: 2px solid var(--green);
    outline-offset: 1px;
  }

  button.go {
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 8px;
    padding: 0 18px;
    font-size: 15px;
    cursor: pointer;
  }
  button.go:hover { background: var(--green); }
  button.go:focus-visible { outline: 2px solid var(--brick); outline-offset: 2px; }

    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-bottom: 12px;
  }

  .chip {
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink-soft);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
  }
  .chip:hover { border-color: var(--green); color: var(--green); }
  .chip.active {
    background: var(--green);
    border-color: var(--green);
    color: var(--paper);

    align-items: center;

    max-height: 88vh;
    overflow-y: auto;
    border-radius: 16px 16px 0 0;
    padding: 22px 20px 32px;

  }

    .sheet { animation: none; }
  }
  @keyframes slideUp {
    from { transform: translateY(24px); opacity: 0; }

    border: 1px solid var(--line);

    display: flex;
    justify-content: space-between;
    align-items: baseline;

    border-bottom: 1px solid var(--line);

    justify-content: space-between;

    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); border: 0;
  }

/* ────────────────────────────────────────────────────────────

// Default fallback origin (used only until we know the visitor's real
// location, or if they decline location access). Offsets above are in
// degrees relative to this point, small enough to stay realistic (~0-1km).
const DEFAULT_ORIGIN = { lat: 35.7796, lng: -78.6382 };

// Bake absolute lat/lng onto each business from the small relative offsets above.
BUSINESSES.forEach(b => {
  b.lat = DEFAULT_ORIGIN.lat + b.lat;
  b.lng = DEFAULT_ORIGIN.lng + b.lng;
});

// Haversine distance in meters — same formula PostGIS's ST_Distance
// approximates for geography points, so behavior matches the real backend.
function haversineMeters(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const toRad = (d) => (d * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// Simulates GET /api/v1/businesses?q=&category=&openNow=&lat=&lng=&radius=
function mockSearch({ q, category, openNow, origin, radiusM }) {
  const now = new Date();
  const dayKeys = ["sun","mon","tue","wed","thu","fri","sat"];
  const today = dayKeys[now.getDay()];
  const nowMinutes = now.getHours() * 60 + now.getMinutes();

  function isOpenNow(hours) {
    const range = hours[today];
    if (!range || range.length !== 2) return false;
    const [start, end] = range.map(t => {
      const [h, m] = t.split(":").map(Number);
      return h * 60 + m;
    });
    return nowMinutes >= start && nowMinutes <= end;
  }

  return BUSINESSES
    .map(b => ({ ...b, distance_m: Math.round(haversineMeters(origin.lat, origin.lng, b.lat, b.lng)) }))
    .filter(b => {
      if (category && b.category_slug !== category) return false;
      if (q && !b.name.toLowerCase().includes(q.toLowerCase()) && !b.description.toLowerCase().includes(q.toLowerCase())) return false;
      if (openNow && !isOpenNow(b.hours)) return false;
      if (radiusM && b.distance_m > radiusM) return false;
      return true;
    })
    .sort((a, b) => a.distance_m - b.distance_m);
}

function mockGetById(id) {
  return BUSINESSES.find(b => b.id === id);
}

/* ──────────────────────────────────────────
   UI LOGIC
   ────────────────────────────────────────── */

const state = {
  q: "",
  category: null,
  openNow: false,
  radiusM: 1000,
  origin: DEFAULT_ORIGIN,
  locationStatus: "pending", // pending | granted | denied | unsupported
};

const chipsEl = document.getElementById("chips");
const resultsEl = document.getElementById("results");
const resultsMetaEl = document.getElementById("resultsMeta");
const qInput = document.getElementById("q");
const openNowInput = document.getElementById("openNow");
const radiusInput = document.getElementById("radius");
const locationBarEl = document.getElementById("locationBar");
const overlay = document.getElementById("overlay");
const sheet = document.getElementById("sheet");

/* ── Geolocation ──────────────────────────────────────────── */

function renderLocationBar() {
  locationBarEl.className = "location-bar";
  if (state.locationStatus === "granted") {
    locationBarEl.classList.add("granted");
    locationBarEl.innerHTML = `<span class="loc-text">📍 Showing places near your current location</span>`;
  } else if (state.locationStatus === "denied") {
    locationBarEl.classList.add("denied");
    locationBarEl.innerHTML = `
      <span class="loc-text">📍 Location access denied — showing places near campus center instead</span>
      <button class="retry" id="retryLocBtn">Try again</button>`;
  } else if (state.locationStatus === "unsupported") {
    locationBarEl.innerHTML = `<span class="loc-text">📍 Your browser doesn't support location — showing places near campus center</span>`;
  } else {
    locationBarEl.innerHTML = `<span class="loc-text">📍 Finding your location…</span>`;
  }

  const retryBtn = document.getElementById("retryLocBtn");
  if (retryBtn) retryBtn.onclick = requestLocation;
}

function requestLocation() {
  state.locationStatus = "pending";
  renderLocationBar();

  if (!("geolocation" in navigator)) {
    state.locationStatus = "unsupported";
    renderLocationBar();
    return;
  }

  navigator.geolocation.getCurrentPosition(
    (position) => {
      state.origin = {
        lat: position.coords.latitude,
        lng: position.coords.longitude,
      };
      state.locationStatus = "granted";
      renderLocationBar();
      runSearch();
    },
    () => {
      // Denied, timed out, or unavailable — fall back gracefully, don't block the page.
      state.origin = DEFAULT_ORIGIN;
      state.locationStatus = "denied";
      renderLocationBar();
      runSearch();
    },
    { enableHighAccuracy: false, timeout: 8000, maximumAge: 5 * 60 * 1000 }
  );
}

function renderChips() {
  chipsEl.innerHTML = "";
  const allChip = document.createElement("button");
  allChip.className = "chip" + (state.category === null ? " active" : "");
  allChip.textContent = "All";
  allChip.onclick = () => { state.category = null; renderChips(); runSearch(); };
  chipsEl.appendChild(allChip);

  CATEGORIES.forEach(cat => {
    const chip = document.createElement("button");
    chip.className = "chip" + (state.category === cat.slug ? " active" : "");
    chip.textContent = cat.name;
    chip.onclick = () => { state.category = cat.slug; renderChips(); runSearch(); };
    chipsEl.appendChild(chip);
  });
}

function formatDistance(m) {
  return m < 1000 ? `${m}m away` : `${(m / 1000).toFixed(1)}km away`;
}

function priceLabel(n) {
  return "$".repeat(n || 1);
}

function renderResults(list) {
  resultsEl.innerHTML = "";

  if (list.length === 0) {
    resultsEl.innerHTML = `
      <div class="empty">
        <h3>No spots match that search</h3>
        <p>Try a different category or clear the search box.</p>
      </div>`;
    return;
  }

  list.forEach(b => {
    const card = document.createElement("div");
    card.className = "card";
    card.tabIndex = 0;
    card.setAttribute("role", "button");
    card.setAttribute("aria-label", `View details for ${b.name}`);
    card.innerHTML = `
      <div class="card-top">
        <h3>${b.name}</h3>
        <span class="rating">★ ${b.avg_rating.toFixed(1)}</span>
      </div>
      <div class="card-sub">${b.category_name} · ${priceLabel(b.price_range)} · ${formatDistance(b.distance_m)}</div>
      <div class="card-tags">
        <span class="tag-pill">${b.review_count} reviews</span>
      </div>
    `;
    card.onclick = () => openDetail(b.id);
    card.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openDetail(b.id); } };
    resultsEl.appendChild(card);
  });
}

function runSearch() {
  const results = mockSearch({
    q: state.q,
    category: state.category,
    openNow: state.openNow,
    origin: state.origin,
    radiusM: state.radiusM,
  });
  resultsMetaEl.textContent = `${results.length} place${results.length === 1 ? "" : "s"} found`;
  renderResults(results);
}

function dayHoursText(hours) {
  const labels = { sun: "Sun", mon: "Mon", tue: "Tue", wed: "Wed", thu: "Thu", fri: "Fri", sat: "Sat" };
  return Object.entries(hours).map(([day, range]) => {
    if (!range || range.length !== 2) return `${labels[day]}: closed`;
    return `${labels[day]}: ${range[0]}–${range[1]}`;
  }).join(" · ");
}

function openDetail(id) {
  const b = mockGetById(id);
  if (!b) return;

  sheet.innerHTML = `
    <button class="sheet-close" id="closeSheet" aria-label="Close details">✕</button>
    <h2 id="sheetTitle">${b.name}</h2>
    <div class="meta-line">${b.category_name} · ★ ${b.avg_rating.toFixed(1)} (${b.review_count} reviews) · ${priceLabel(b.price_range)}</div>
    <p class="desc">${b.description}</p>
    <dl class="info-grid">
      <dt>Address</dt><dd>${b.address}</dd>
      <dt>Phone</dt><dd>${b.phone}</dd>
      <dt>Hours</dt><dd>${dayHoursText(b.hours)}</dd>
    </dl>
    <div class="reviews-head">
      <h3>Reviews</h3>
    </div>
    ${b.reviews.map(r => `
      <div class="review">
        <div class="review-top">
          <span class="review-name">${r.student_name}</span>
          <span class="review-rating">★ ${r.rating}</span>
        </div>
        <div class="review-comment">${r.comment}</div>
      </div>
    `).join("")}
  `;

  overlay.classList.add("open");
  document.getElementById("closeSheet").onclick = closeDetail;
  document.getElementById("closeSheet").focus();
}

function closeDetail() {
  overlay.classList.remove("open");
}

overlay.addEventListener("click", (e) => {
  if (e.target === overlay) closeDetail();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && overlay.classList.contains("open")) closeDetail();
});

document.getElementById("searchBtn").onclick = () => {
  state.q = qInput.value.trim();
  runSearch();
};
qInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    state.q = qInput.value.trim();
    runSearch();
  }
});
openNowInput.onchange = () => {
  state.openNow = openNowInput.checked;
  runSearch();
};

radiusInput.onchange = () => {
  state.radiusM = Number(radiusInput.value); // 0 means "any distance"
  runSearch();
};

renderChips();
renderLocationBar();
runSearch();          // initial paint using the default campus-center origin
requestLocation();    // then ask the browser for the real position and re-run

/* ── PWA: service worker registration + install prompt ─────── */

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch((err) => {
      console.warn("Service worker registration failed:", err);
    });
  });
}

let deferredInstallPrompt = null;
const installBtn = document.getElementById("installBtn");

window.addEventListener("beforeinstallprompt", (event) => {
  // Chrome/Android fires this when the app is installable — stash the event
  // and show our own button instead of relying on the browser's default UI.
  event.preventDefault();
  deferredInstallPrompt = event;
  if (installBtn) installBtn.hidden = false;
});

if (installBtn) {
  installBtn.addEventListener("click", async () => {
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    installBtn.hidden = true;
  });
}

window.addEventListener("appinstalled", () => {
  if (installBtn) installBtn.hidden = true;
});

// iOS Safari has no beforeinstallprompt API — detect iOS + "not already
// installed" and show manual instructions instead of a broken button.
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
if (isIOS && !isStandalone) {
  const hint = document.getElementById("iosHint");
  if (hint) hint.hidden = false;
}
</script>
